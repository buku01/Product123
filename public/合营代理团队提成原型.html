function renderDemo(){ $('view').innerHTML='<div class="panel filters"><b>提成归属演示</b><label>场景：<select id="scenario"><option value="none">仅 A 为合营代理</option><option value="c" selected>C 升级为合营代理</option><option value="cf">C、F 均升级为合营代理</option></select></label><label>每位用户有效投注：<input id="demoAmount" type="number" min="0" max="100000000" value="10000" step="100"></label><button class="blue" id="runDemo">重新计算</button></div><div class="hint" id="demoHint"></div><div id="demoResult"></div>';$('runDemo').onclick=calculateDemo;$('scenario').onchange=calculateDemo;calculateDemo()}
function calculateDemo(){
  const scenario=$('scenario').value,c=scenario!=='none',f=scenario==='cf',amount=Number($('demoAmount').value);
  if(!$('demoAmount').value||!Number.isFinite(amount)||amount<0||amount>100000000){toast('请输入 0–100,000,000 的有效投注金额');return}
  const descriptions={none:'当前仅 A 为合营代理：B 为 A 的直属下线；C、D、E、F、G、H 均按团队点位归 A。',c:'C 升级为合营代理：C 本人投注仍归 A；D 为 C 的直属下线，E、F、G、H 按团队点位归 C。',cf:'C、F 均升级为合营代理：C 本人投注归 A；F 本人投注归 C；D 为 C 的直属下线，E 归 C 团队；G 为 F 的直属下线，H 归 F 团队。'};
  $('demoHint').textContent=descriptions[scenario]+' 每笔投注只归属一个合营代理。本演示独立于历史提成记录，不改变发放状态。';
  const date='2026-10-05',totals={A:0,C:0,F:0},rates=futureConfig&&futureConfig.effective<='2026-10-05T00:00'?futureConfig:config;
  const body=Object.keys(parent).map(u=>{const a=owner(u,date,c,f),kind=parent[u]===a?'direct':'team',rate=rates[kind][0],income=Math.round(amount*rate)/100;totals[a]+=income;return '<tr><td>'+u+'</td><td>'+parent[u]+'</td><td><b>'+a+'</b></td><td>'+depth(u,a)+'级</td><td>'+(kind==='direct'?'直属':'团队')+'</td><td>'+rate.toFixed(2)+'%</td><td class="num">'+money(amount)+'</td><td class="num money">'+money(income)+'</td></tr>'}).join('');
  const node=u=>'<div class="node '+(u==='A'||u==='C'&&c||u==='F'&&f?'agent':'')+'">'+u+'<small>'+(u==='A'||u==='C'&&c||u==='F'&&f?'合营代理':'普通用户')+'</small></div>';
  const tree='<div class="nodes">'+node('A')+'<span class="arrow">→</span>'+node('B')+'<span class="arrow">→</span>'+node('C')+'<span class="arrow">→</span>'+node('D')+'<div style="display:flex;flex-direction:column;gap:13px;align-items:flex-start"><div style="display:flex;align-items:center;gap:12px"><span class="arrow">↗</span>'+node('E')+'</div><div style="display:flex;align-items:center;gap:12px"><span class="arrow">↘</span>'+node('F')+'<span class="arrow">→</span>'+node('G')+'<span class="arrow">→</span>'+node('H')+'</div></div></div>';
  $('demoResult').innerHTML=tree+table(['投注用户','直接邀请人','提成归属代理','相对层级','点位档位','提成比例','有效投注额','提成金额'],body)+'<div class="metrics">'+Object.entries(totals).map(([a,n])=>'<div class="metric">代理 '+a+' 投注提成<strong>'+money(n)+'</strong></div>').join('')+'<div class="metric">归属校验<strong>7 / 7</strong><small>每笔投注只分配一次</small></div><div class="metric">计算游戏<strong style="font-size:14px">加拿大28</strong><small>演示投注时间：10-05 00:00</small></div></div>'
}
function renderRules(){$('view').innerHTML='<div class="split"><div class="panel note"><h3>01　新增入口与配置</h3><p>左侧统一进入“合营代理提成报表”。主菜单“合营代理提成报表”下区分直属提成、团队提成；主菜单“代理游戏返点配置”下区分直属提成配置、团队提成配置。</p><p>团队点位按游戏配置，与直属点位独立。点位单位为百分比，例如 0.10 表示 0.10%，不是 10%。</p><p>合营代理管理保留原有字段，在“合营直属提成”后新增“合营团队提成”，并在列表上方增加字段说明。</p></div><div class="panel note"><h3>02　归属与截断</h3><p>从投注用户的邀请上级开始，向上查找最近的已生效合营代理，作为唯一归属代理。</p><p>一级直属使用直属点位；二级及以后使用团队点位，层级不设上限。</p><p>新代理本人投注仍归上级。新代理下级从升级生效后独立归属，上级不再获取同笔投注提成。</p></div><div class="panel note"><h3>03　时间与金额口径</h3><p>原型按下注时间确定归属与点位。C 在 10-03 00:00 生效，F 在 10-04 00:00 生效；生效瞬间及之后使用新归属。</p><p>按每筆有效投注金额 × 适用点位计算，四舍五入到分后汇总。本原型使用已确认有效投注，不纳入撤单及无效投注。</p><p>历史归属和点位留存；配置变更只作用于生效后的新投注。</p></div><div class="panel note"><h3>04　报表与明细</h3><p>直属汇总列为代理id(账号)/直属下线、总下注/中奖、总反水/直属提成、操作；团队汇总第三列仅显示团队提成。</p><p>点击“提成明细”进入独立明细页面，展示 ID、代理(UID)、用户(UID)、游戏名称、下注金额、提成比例、提成金额、统计日期八列。支持日期筛选、关键字搜索、导出及返回。</p><p>【净输赢】净输赢 = 总输赢 + 优惠 + 反水 + 平台费 + 代理红利 + 资金费 + 合营直属提成 + 合营团队提成。</p></div></div><div class="hint"><b>本版业务假设</b><br>新合营代理自身投注继续归上级；按下注时间切换；点位采用全局游戏配置；历史不追溯。正式实施时需确认撤单冲正、代理停用后的归属。</div>'}
function exportRows(){if(!filtered.length){toast('暂无可导出数据');return}const data=[['记录ID','投注ID','日期','归属代理UID','投注用户UID','游戏类型','档位','有效投注额','点位%','提成金额','状态'],...filtered.map(r=>[r.record,r.id,r.date,uid[r.agent],uid[r.user],games[r.game],r.kind==='team'?'团队':'直属',r.amount,r.rate,r.commission,r.state])];const csv='\uFEFF'+data.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='合营代理_'+page+'_提成明细.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出 '+filtered.length+' 条投注提成明细')}
