  $('demoResult').innerHTML=tree+table(headers,body)+'<div class="metrics">'+metricHTML+'<div class="metric">归属校验<strong>'+demoUsers.length+' / '+demoUsers.length+'</strong><small>每笔投注只分配一次</small></div><div class="metric">计算游戏<strong style="font-size:14px">加拿大28</strong><small>演示投注时间：'+(showRegistration?'11-25':'10-05')+' 00:00</small></div></div>'
}
