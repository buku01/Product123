<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>同名渠道归类原型</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf0f6;color:#1d2942;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;color:inherit}.stage{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;gap:52px;padding:30px;background:radial-gradient(circle at 70% 15%,#fff9ef 0,transparent 32%),#edf0f6}.phone{width:430px;height:900px;position:relative;overflow:hidden;background:#fff;border-radius:36px;box-shadow:0 25px 70px #1927452e}.status{height:44px;padding:11px 22px 0;display:flex;justify-content:space-between;font-size:14px;color:#111}.island{width:120px;height:27px;margin-top:-5px;border-radius:20px;background:#080808}.nav{height:64px;display:grid;grid-template-columns:56px 1fr 76px;align-items:center;border-bottom:1px solid #f1f2f5}.nav button{border:0;background:none;cursor:pointer;font-size:38px}.nav div{display:flex;justify-content:center;gap:42px;font-size:18px}.nav strong{color:#f6a23c}.nav span{color:#44557b}.nav .help{font-size:15px}.methods{height:276px;overflow:hidden;padding:10px 16px 12px;border-bottom:8px solid #f7f8fa}.method-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.method{height:76px;position:relative;border:1px solid #e1e3e8;border-radius:8px;background:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;overflow:hidden}.method.active{border-color:#f6a23c;box-shadow:inset 0 0 0 1px #ffd9a8}.method.active:after{content:"✓";position:absolute;right:0;bottom:0;width:20px;height:20px;background:#f6a23c;color:#fff;clip-path:polygon(100% 0,100% 100%,0 100%);font-size:10px;padding:7px 0 0 9px}.method em{position:absolute;right:-18px;top:6px;width:66px;transform:rotate(45deg);background:#f0463e;color:#fff;font-size:9px;font-style:normal;line-height:16px}.method b{font-size:13px;font-weight:500}.icon{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;color:#fff;font-size:17px;font-weight:700}.blue{background:#4b92e7}.green{background:#20b769}.cyan{background:#1aa9bf}.red{background:#e3303f}.black{background:#252525}.gradient{background:linear-gradient(135deg,#ec315d,#1aa6b8)}.channels{height:516px;overflow-y:auto;padding:18px 16px 42px;scrollbar-width:none}.channels::-webkit-scrollbar{display:none}.title{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}.title h1{margin:0 0 4px;font-size:17px}.title p{margin:0;font-size:11px;color:#8b94a5}.title>span{padding:4px 8px;border-radius:20px;background:#fff4e6;color:#d88728;font-size:11px}.channel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{min-height:92px;position:relative;border:1px solid #dfe3ea;border-radius:9px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px 7px}.card:hover{border-color:#f4bb73}.card.selected{border:1.5px solid #f6a23c;background:#fffaf3}.card b{font-size:14px}.card>span:not(.check){font-size:13px;margin-top:3px}.card small{margin-top:8px;font-size:10px;color:#b77728;background:#fff1de;border-radius:8px;padding:2px 6px}.card .direct{color:#a2a8b2;background:transparent}.check{position:absolute;right:6px;top:5px;display:grid;place-items:center;width:16px;height:16px;border-radius:50%;color:#fff;background:#f6a23c;font-size:10px}.current{margin-top:14px;text-align:center;color:#9aa1ae;font-size:11px}.current b{color:#d98b2d}.overlay{display:none;position:absolute;inset:0;z-index:10;background:#1118277a;align-items:flex-end}.overlay.show{display:flex}.sheet{width:100%;padding:8px 18px 22px;border-radius:22px 22px 0 0;background:#fff;animation:rise .25s ease-out}.handle{width:38px;height:4px;margin:0 auto 17px;border-radius:4px;background:#d7d9de}.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.sheet-head h2{margin:0 0 5px;font-size:19px}.sheet-head p{margin:0;color:#8b94a5;font-size:12px}.close{border:0;background:#f4f5f7;width:30px;height:30px;border-radius:50%;cursor:pointer;color:#7b8493;font-size:20px}.routes{display:flex;flex-direction:column;gap:10px}.route{min-height:70px;width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid #e4e6eb;border-radius:12px;background:#fff;cursor:pointer;text-align:left}.route:hover,.route.chosen{border-color:#f6a23c;background:#fffaf4}.route-logo{flex:0 0 auto;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,#ffbc64,#ee8b2c);color:#fff;font-weight:700}.route-main{flex:1;display:flex;flex-direction:column;gap:5px}.route-main b{font-size:14px}.route-main small{color:#8d95a3;font-size:11px}.route em{color:#df8a24;background:#fff0da;border-radius:12px;padding:3px 7px;font-size:10px;font-style:normal;white-space:nowrap}.radio{width:18px;height:18px;border:1.5px solid #ccd1da;border-radius:50%}.chosen .radio{border:5px solid #f6a23c}.note{text-align:center;margin:15px 0 0;color:#a2a8b2;font-size:10px}.toast{display:none;position:absolute;z-index:20;left:50%;bottom:32px;transform:translateX(-50%);border-radius:20px;padding:10px 18px;background:#1c232fee;color:#fff;font-size:12px;white-space:nowrap}.toast.show{display:block}.intro{width:300px;margin-top:210px}.intro>span{color:#dc8e31;background:#fff5e8;border:1px solid #f8d9b4;border-radius:20px;padding:6px 11px;font-size:12px}.intro h2{margin:19px 0 10px;font-size:27px}.intro p,.intro li{color:#657086;line-height:1.7;font-size:14px}.intro ul{padding-left:19px}@keyframes rise{from{transform:translateY(100%)}}@media(max-width:780px){body{background:#fff}.stage{padding:0;display:block;background:#fff}.phone{width:100%;height:100dvh;min-height:680px;border-radius:0;box-shadow:none}.channels{height:calc(100dvh - 384px)}.intro{display:none}}
    /* 选中态：右下角折角对勾 */
    .check{position:absolute;right:0;bottom:0;top:auto;width:24px;height:24px;border-radius:0;color:#fff;background:#f6a23c;clip-path:polygon(100% 0,100% 100%,0 100%);font-size:11px;font-weight:700;padding:10px 0 0 11px;display:block}
  </style>
</head>
<body>
<main class="stage">
  <section class="phone">
    <header class="status"><b>21:37</b><span class="island"></span><span>▮▮▮ 5G 🔋</span></header>
    <nav class="nav"><button aria-label="返回">‹</button><div><strong>存款</strong><span>自助补单</span></div><button class="help">教程 ⓘ</button></nav>
    <div class="methods"><div class="method-grid" id="methods"></div></div>
    <section class="channels"><div class="title"><div><h1>请选择通道</h1></div></div><div class="channel-grid" id="channelGrid"></div><div class="current">当前选择 <b id="current">金花直连</b></div></section>
    <div class="overlay" id="overlay"><section class="sheet" role="dialog"><div class="handle"></div><div class="sheet-head"><div><h2 id="sheetTitle"></h2></div><button class="close" id="close">×</button></div><div class="routes" id="routes"></div></section></div>
    <div class="toast" id="toast"></div>
  </section>
  <aside class="intro"><span>交互原型</span><h2>同名渠道归类</h2><p>点击带“多个渠道”的卡片，体验底部弹窗选择。</p><ul><li>减少重复卡片，缩短页面</li><li>展示速度和成功率</li><li>单一渠道直接选中</li></ul></aside>
</main>
<script>
const methods=[['C','CGpay','减8','blue'],['e','EGPay','减18','blue'],['T','虚拟币充值','3%','green'],['支','支付宝秒存','推荐','cyan'],['¥','数字RMB秒存','推荐','red'],['微','微信秒存','推荐','green'],['Q','QQ充值','', 'black'],['支','支付宝充值','', 'cyan'],['卡','卡密充值','', 'blue'],['微','微信充值','', 'green'],['¥','数字人民币','', 'red'],['U','银联扫码','', 'gradient']];
const groups=[
['金花卡',[['jh-a','金花直连','约 1 分钟','98.6%','推荐']]],
['女王卡',[['nw-a','女王通道 A','约 1–2 分钟','98.2%','推荐'],['nw-b','女王通道 B','约 3 分钟','96.8%','']]],
['伟乐卡',[['wl-a','伟乐直连','约 2 分钟','97.5%','']]],
['月光卡',[['yg-a','月光极速','约 30 秒','99.1%','到账快'],['yg-b','月光稳定','约 2 分钟','98.5%','成功率高'],['yg-c','月光备用','约 3–5 分钟','96.9%','']]],
['百搭卡',[['bd-a','百搭通道 A','约 1 分钟','98.8%','推荐'],['bd-b','百搭通道 B','约 2 分钟','97.2%',''],['bd-c','百搭通道 C','约 3 分钟','96.5%','']]],
['狮子卡',[['sz-a','狮子直连','约 2 分钟','97.9%','']]],['百礼卡',[['bl-a','百礼直连','约 1 分钟','98.1%','']]],['红宝卡',[['hb-a','红宝直连','约 2 分钟','97.4%','']]],
['进胡卡',[['jh-1','进胡通道 A','约 1 分钟','98.3%','推荐'],['jh-2','进胡通道 B','约 3 分钟','96.7%','']]],
['风花卡',[['fh-a','风花直连','约 2 分钟','97.1%','']]],['亮亮卡',[['ll-a','亮亮直连','约 1 分钟','98.0%','']]],
['龙行卡',[['lx-a','龙行通道 A','约 1 分钟','98.4%','推荐'],['lx-b','龙行通道 B','约 2 分钟','97.6%','']]],
['四季鑫旺卡',[['sj-a','四季直连','约 2 分钟','97.7%','']]],['岭峰卡',[['lf-a','岭峰直连','约 1 分钟','98.2%','']]],['金御卡',[['jy-a','金御直连','约 2 分钟','97.8%','']]]];
let selected='jh-a',active=null,timer;
const $=s=>document.querySelector(s);
$('#methods').innerHTML=methods.map((m,i)=>`<button class="method ${i===8?'active':''}">${m[2]?`<em>${m[2]}</em>`:''}<span class="icon ${m[3]}">${m[0]}</span><b>${m[1]}</b></button>`).join('');
function render(){ $('#channelGrid').innerHTML=groups.map((g,i)=>{const on=g[1].some(r=>r[0]===selected);return `<button class="card ${on?'selected':''}" data-i="${i}">${on?'<span class="check">✓</span>':''}<b>${g[0]}</b><span>20–200</span>${g[1].length>1?`<small>${g[1].length}个渠道 ›</small>`:''}</button>`}).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>openGroup(groups[+b.dataset.i]));}
function openGroup(g){if(g[1].length===1){choose(g[1][0]);return}active=g;$('#sheetTitle').textContent=`选择“${g[0]}”渠道`;$('#routes').innerHTML=g[1].map((r,i)=>`<button class="route ${r[0]===selected?'chosen':''}" data-id="${r[0]}"><span class="route-logo">${i+1}</span><span class="route-main"><b>${g[0]}</b><small>20–200</small></span><span class="radio"></span></button>`).join('');document.querySelectorAll('.route').forEach(b=>b.onclick=()=>choose(g[1].find(r=>r[0]===b.dataset.id)));$('#overlay').classList.add('show')}
function choose(r){const name=r[1].replace(/\s+[A-Z]$/, '');selected=r[0];$('#current').textContent=name;$('#overlay').classList.remove('show');render();clearTimeout(timer);$('#toast').textContent='已选择：'+name;$('#toast').classList.add('show');timer=setTimeout(()=>$('#toast').classList.remove('show'),1800)}
$('#close').onclick=()=>$('#overlay').classList.remove('show');$('#overlay').onclick=e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('show')};render();
</script>
</body>
</html>
