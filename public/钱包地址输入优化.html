<header><h1>钱包地址输入优化</h1><p>外部粘贴地址时，自动去除首尾空白。</p></header><section id="requirements-panel" class="notes" aria-label="需求说明"><div class="spec"><div><p><strong>场景问题说明：</strong></p><p>用户复制钱包地址时，可能连同前后的空格或换行一起复制。粘贴后若地址被清空或校验失败，用户容易误以为是平台问题。</p><b style="margin-top:14px">需求说明：</b><p>用户从外部复制并粘贴地址时，静默去除地址首尾的空格、Tab、回车和换行符，不展示任何清理提示。</p><p>示例：<code>  AbC123  </code> → <code>AbC123</code></p></div></div></section><section id="prototype-panel" class="prototype-panel" aria-label="原型预览">
<nav class="mobile-nav" aria-label="原型页面"></nav><main class="workspace" aria-label="七种提现账户原型"></main></section>

<script>

const previews=[],trimEdges=value=>value.trim();let timer;

function toast(p,msg){const el=p.querySelector('.phone-toast');el.textContent=msg;el.classList.add('show');clearTimeout(el.timeout);el.timeout=setTimeout(()=>el.classList.remove('show'),2800)}
function error(p,msg){const wrap=p.querySelector('.account-wrap'),input=p.querySelector('.address');wrap.classList.toggle('invalid',!!msg);input.setAttribute('aria-invalid',String(!!msg));wrap.querySelector('.field-error').textContent=msg}
function clean(p){const input=p.querySelector('.address'),raw=input.value,pos=input.selectionStart,leading=raw.length-raw.trimStart().length;const value=trimEdges(raw);if(raw!==value){input.value=value;if(pos!==null)input.setSelectionRange(Math.max(0,Math.min(value.length,pos-leading)),Math.max(0,Math.min(value.length,pos-leading)));}return value}
function check(p){const value=p.querySelector('.address').value;if(!value){error(p,'请输入钱包地址');return false}error(p,'');return true}
